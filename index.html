<!doctype html>
<html lang="en">
  <head>
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("scoutTheme");
        const theme =
          param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <script>
      (() => {
        const saved = window.localStorage.getItem("ben-theme");
        if (!new URLSearchParams(window.location.search).get("scoutTheme")) {
          document.documentElement.setAttribute("data-theme", saved || "dark");
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="B3N.B4UR_ — ideas and practical patterns about AI architecture, career development, and leadership."
    />
    <title>B3N.B4UR_ — Be. Extrodenary. Now.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
